---
# --------------------------------------------------------------------------------
# 0. SETUP
# --------------------------------------------------------------------------------
- name: Provision Pop_OS! Workstations
  hosts: workstations
  gather_facts: true

  vars:
    user_name: "ccianos"
    user_home: "/home/{{ user_name }}"
    repo_src: "{{ playbook_dir | dirname }}"

    required_packages:
      - zsh
      - vim
      - tmux
      - git
      - curl
      - bash-completion
      - fortune-mod
      - fortunes
      - cowsay
      - golang-go
      - initramfs-tools

  handlers:
    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      become: true
      listen: "trigger sysctl reload"

    - name: Update initramfs
      ansible.builtin.command:
        cmd: update-initramfs -u
      become: true
      listen: "trigger initramfs update"

  tasks:
    # --------------------------------------------------------------------------------
    # 1. SYS PKGS & CONFIGS
    # --------------------------------------------------------------------------------
    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Configure kernel system variables
      ansible.builtin.copy:
        src: "{{ repo_src }}/sysctl/sysctl.conf"
        dest: /etc/sysctl.conf
        owner: root
        group: root
        mode: 0644
        backup: true
      become: true
      notify: "trigger sysctl reload"

    - name: Configure initramfs settings
      ansible.builtin.copy:
        src: "{{ repo_src }}/initramfs-tools/initramfs.conf"
        dest: /etc/initramfs-tools/initramfs.conf
        owner: root
        group: root
        mode: 0644
        backup: true
      become: true
      notify: "trigger initramfs update"

    # --------------------------------------------------------------------------------
    # 2. USER ENV & DIR STRUCT
    # --------------------------------------------------------------------------------
    - name: Ensure target directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0755
      become: true
      loop:
        - "{{ user_home }}/bin"
        - "{{ user_home }}/.vim/colors"

    # --------------------------------------------------------------------------------
    # 3. SHELL CONFIGS
    # --------------------------------------------------------------------------------
    - name: Deploy Zsh config files
      ansible.builtin.copy:
        src: "{{ repo_src }}/zsh/{{ item.src }}"
        dest: "{{ user_home }}/{{ item.dest }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0644
        backup: true
      become: true
      loop:
        - { src: '.zshrc', dest: '.zshrc' }
        - { src: '.aliases', dest: '.aliases' }
        - { src: '.exports', dest: '.exports' }
        - { src: '.shell_universal', dest: '.shell_universal' }

    - name: Set Zsh as default shell 
      ansible.builtin.user:
        name: "{{ user_name }}"
        shell: /bin/zsh
      become: true
 
    # --------------------------------------------------------------------------------
    # 4. VIM CONFIGS
    # --------------------------------------------------------------------------------
    - name: Deploy Vim config files
      ansible.builtin.copy:
        src: "{{ repo_src }}/vim/{{ item.src }}"
        dest: "{{ user_home }}/{{ item.dest }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0644
        backup: true
      become: true
      loop:
        - { src: '.vimrc', dest: '.vimrc' }
        - { src: 'colors/vividchalk.vim', dest: '.vim/colors/vividchalk.vim' }

    # --------------------------------------------------------------------------------
    # 5. TMUX CONFIGS & CUSTOM BINARIES
    # --------------------------------------------------------------------------------
    - name: Deploy Tmux config
      ansible.builtin.copy:
        src: "{{ repo_src }}/tmux/.tmux.conf"
        dest: "{{ user_home }}/.tmux.conf"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0644
        backup: true
      become: true

    - name: Deploy custom executables to ~/bin
      ansible.builtin.copy:
        src: "{{ repo_src }}/tmux/{{ item.src }}"
        dest: "{{ user_home }}/bin/{{ item.dest }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0755
        backup: true
      become: true
      loop:
        - { src: 'alphamux.sh', dest: 'alphamux.sh' }
        - { src: 'winmux.sh', dest: 'winmux.sh' }

    # --------------------------------------------------------------------------------
    # 5. APP CONFIGS
    # --------------------------------------------------------------------------------
    - name: Deploy AntiMicroX controller profile
      ansible.builtin.copy:
        src: "{{ repo_src }}/antimicrox/xbox_cntrl_config.gamecontroller.amgp"
        dest: "{{ user_home }}/xbox_cntrl_config.gamecontroller.amgp"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0644
        backup: true
      become: true

    # --------------------------------------------------------------------------------
    # 6. OMZ & EXTENSIONS
    # --------------------------------------------------------------------------------
    - name: Clone Omz repo
      ansible.builtin.git:
        repo: "https://github.com/ohmyzsh/ohmyzsh.git"
        dest: "{{ user_home }}/.oh-my-zsh"
        depth: 1
        update: false
      become: false

    - name: Clone p10k repo
      ansible.builtin.git:
        repo: "https://github.com/romkatv/powerlevel10k.git"
        dest: "{{ user_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1
        update: false
      become: false

    - name: Clone custom Omz plugins
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ user_home }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
        depth: 1
        update: false
      loop:
        - name: zsh-autosuggestions
          repo: "https://github.com/zsh-users/zsh-autosuggestions.git"
        - name: zsh-syntax-highlighting
          repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
        - name: zsh-completions
          repo: "https://github.com/zsh-users/zsh-completions.git"
      become: false

    # --------------------------------------------------------------------------------
    # 7. DEIN VIM PLUGIN MANAGER
    # --------------------------------------------------------------------------------
    - name: Ensure Dein.vim dir sructure exists
      ansible.builtin.file:
        path: "{{ user_home }}/.cache/dein/repos/github.com/Shougo"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0755
      become: true

    - name: Clone Dein.vim
      ansible.builtin.git:
        repo: "https://github.com/Shougo/dein.vim.git"
        dest: "{{ user_home }}/.cache/dein/repos/github.com/Shougo/dein.vim"
        depth: 1
        update: false
      become: false
