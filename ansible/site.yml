---
# --------------------------------------------------------------------------------
# 0. SETUP
# --------------------------------------------------------------------------------
- name: Provision Pop_OS! Workstations
  hosts: workstations
  gather_facts: true

  vars:
    user_name: "ccianos"
    user_home: "/home/{{ user_name }}"
    repo_src: "{{ playbook_dir }}"

    required_packages:
      - zsh
      - vim
      - tmux
      - initramfs-tools

  handlers:
    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      listen: "trigger sysctl reload"

    - name: Update initramfs
      ansible.builtin.command:
        cmd: update-initramfs -u
      listen: "trigger initramfs update"

  tasks:
    # --------------------------------------------------------------------------------
    # 1. SYS PKGS & CONFIGS
    # --------------------------------------------------------------------------------
    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Configure kernel system variables
      ansible.builtin.copy:
        src: "{{ repo_src }}/sysctl/sysctl.conf"
        dest: /etc/sysctl.conf
        owner: root
        group: root
        mode: 0644
        backup: true
      become: true
      notify: "trigger sysctl reload"

    - name: Configure initramfs settings
      ansible.builtin.copy:
        src: "{{ repo_src }}/initramfs-tools/initramfs.conf"
        dest: /etc/initramfs-tools/initramfs.conf
        owner: root
        group: root
        mode: 0644
        backup: true
      become: true
      notify: "trigger initramfs update"

    # --------------------------------------------------------------------------------
    # 2. USER ENV & DIR STRUCT
    # --------------------------------------------------------------------------------
    - name: Ensure target directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0755
      loop:
        - "{{ user_home }}/bin"
        - "{{ user_home }}/.vim/colors"

    # --------------------------------------------------------------------------------
    # 3. SHELL CONFIGS
    # --------------------------------------------------------------------------------
    - name: Deploy Zsh config files
      ansible.builtin.copy:
        src: "{{ repo_src }}/zsh/{{ item.src }}"
        dest: "{{ user_home }}/{{ item.dest }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0644
        backup: true
      loop:
        - { src: '.zshrc', dest: '.zshrc' }
        - { src: '.aliases', dest: '.aliases' }
        - { src: '.exports', dest: '.exports' }
        - { src: '.shell_universal', dest: '.shell_universal' }

    - name: Set Zsh as default shell 
      ansible.builtin.user:
        name: "{{ user_name }}"
        shell: /bin/zsh
 
    # --------------------------------------------------------------------------------
    # 4. VIM CONFIGS
    # --------------------------------------------------------------------------------
    - name: Deploy Vim config files
      ansible.builtin.copy:
        src: "{{ repo_src }}/vim/{{ item.src }}"
        dest: "{{ user_home }}/{{ item.dest }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0644
        backup: true
      loop:
        - { src: '.vimrc', dest: '.vimrc' }
        - { src: 'colors/vividchalk.vim', dest: '.vim/colors/vividchalk.vim' }

    # --------------------------------------------------------------------------------
    # 5. TMUX CONFIGS & CUSTOM BINARIES
    # --------------------------------------------------------------------------------
    - name: Deploy Tmux config
      ansible.builtin.copy:
        src: "{{ repo_src }}/tmux/.tmux.conf"
        dest: "{{ user_home }}/.tmux.conf"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0644
        backup: true

    - name: Deploy custom executables to ~/bin
      ansible.builtin.copy:
        src: "{{ repo_src }}/tmux/{{ item.src }}"
        dest: "{{ user_home }}/bin/{{ item.dest }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0755
        backup: true
      loop:
        - { src: 'alphamux.sh', dest: 'alphamux.sh' }
        - { src: 'winmux.sh', dest: 'winmux.sh'' }
